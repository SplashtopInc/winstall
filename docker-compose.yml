services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WINSTALL_APP_TAG:-winstall/app-latest}
    container_name: winstall-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo2:27017/winstall}
      - USE_HOST_INTERNAL=${USE_HOST_INTERNAL:-true}

  mongo2:
    image: mongo:8
    container_name: winstall-mongo2
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: winstall
    volumes:
      - mongo2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo2-data:
