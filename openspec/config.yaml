schema: spec-driven

context: |
  Follow AGENTS.md for tech stack, naming conventions, and language rules.
  OpenSpec artifact names (proposal.md, design.md, tasks.md, spec.md) stay as the schema defines them.
  Requirements live in openspec/specs/**/spec.md (change deltas under openspec/changes/<name>/specs/).
  Architecture lives in openspec/specs/**/design.md after archive; during a change, design.md in the change root is the working architecture.
  Capability directories use kebab-case (e.g., home-trending).
  MODIFIED requirement titles MUST remain byte-for-byte matches of existing titles in openspec/specs/.
  BDD Keywords: Keep all BDD keywords (such as GIVEN, WHEN, THEN, Scenario, ADDED, MODIFIED, REMOVED, Requirement) in English uppercase.

rules:
  proposal:
    - Write Why / What Changes / Impact in Chinese
    - Capability paths kebab-case
  specs:
    - "New capabilities: Purpose, requirements, and scenarios in Chinese"
    - "MODIFIED / REMOVED / RENAMED: keep existing requirement and scenario titles unchanged"
    - "Keep all BDD keywords (GIVEN, WHEN, THEN, Scenario, ADDED, MODIFIED, REMOVED, Requirement) in English uppercase"
    - "Semantic explanations and descriptions in requirements and scenarios MUST be written in Chinese"
    - API paths in scenarios MUST be kebab-case lowercase plural
  design:
    - Write in Chinese
    - After archive, architecture content belongs at openspec/specs/<capability>/design.md
  tasks:
    - Write task text in Chinese
    - Refer to files with lowerCamelCase paths
    - Do not introduce PascalCase filenames for new work in this repo's change
githubCopilot:
  cloudAgent: false
